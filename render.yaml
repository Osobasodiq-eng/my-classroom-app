databases:
  - name: classroom-governor-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: classroom-governor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classroom-governor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOVERNOR_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_SSL
        value: "true"
