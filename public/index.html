  async function loadAssistantConversations(){
    const token = role === "governor" ? authToken : studentToken;
    if(!token) return;
    try{
      const res = await fetch("/api/assistant/conversations?courseId=" + encodeURIComponent(assistantCourseId), {
        headers: {"Authorization":"Bearer " + token},
      });
      if(!res.ok) return;
      const json = await res.json();
      assistantConversations = json.conversations || [];
      assistantConversationsLoadedFor = assistantCourseId;
      render();
    }catch(err){ /* silently keep whatever's already shown */ }
  }

  async function loadConversation(id){
    const token = role === "governor" ? authToken : studentToken;
    if(!token) return;
    try{
      const res = await fetch("/api/assistant/conversations/" + encodeURIComponent(id), {
        headers: {"Authorization":"Bearer " + token},
      });
      if(!res.ok) return;
      const json = await res.json();
      assistantMessages = json.conversation.messages || [];
      assistantConversationId = json.conversation.id;
      render();
    }catch(err){ alert("Could not load that conversation — check your connection."); }
  }

  function attachAssistantEvents(){
    const chatWindow = document.getElementById("chatWindow");
    if(chatWindow) chatWindow.scrollTop = chatWindow.scrollHeight;

    if(assistantConversationsLoadedFor !== assistantCourseId){
      loadAssistantConversations();
    }

    const courseSelect = document.getElementById("assistantCourseSelect");
    if(courseSelect) courseSelect.addEventListener("change", () => {
      assistantCourseId = courseSelect.value;
      assistantMessages = [];
      assistantConversationId = null;
      assistantConversationsLoadedFor = null;
      assistantShowHistory = false;
      render();
    });
    const newChatBtn = document.getElementById("assistantNewChat");
    if(newChatBtn) newChatBtn.addEventListener("click", () => {
      assistantMessages = [];
      assistantConversationId = null;
      render();
    });
    const toggleHistoryBtn = document.getElementById("assistantToggleHistory");
    if(toggleHistoryBtn) toggleHistoryBtn.addEventListener("click", () => { assistantShowHistory = !assistantShowHistory; render(); });

    document.querySelectorAll("[data-load-conversation]").forEach(el => el.addEventListener("click", (e) => {
      if(e.target.closest("[data-delete-conversation]")) return;
      loadConversation(el.getAttribute("data-load-conversation"));
    }));
    document.querySelectorAll("[data-delete-conversation]").forEach(btn => btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute("data-delete-conversation");
      if(!(await confirmDialog("This conversation will be permanently deleted.", {title:"Delete this conversation?", confirmLabel:"Delete"}))) return;
      const token = role === "governor" ? authToken : studentToken;
      try{
        await fetch("/api/assistant/conversations/" + encodeURIComponent(id), { method:"DELETE", headers:{"Authorization":"Bearer " + token} });
      }catch(err){ /* list refresh below will reflect actual state either way */ }
      if(assistantConversationId === id){ assistantMessages = []; assistantConversationId = null; }
      assistantConversationsLoadedFor = null;
      render();
    }));

    const form = document.getElementById("assistantForm");
    if(form){
      const input = document.getElementById("assistantInput");
      input.addEventListener("keydown", (e) => {
        if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
      });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if(!question || assistantBusy) return;
        const token = role === "governor" ? authToken : studentToken;
        if(!token){ alert("Sign in to use the study assistant."); return; }

        assistantMessages.push({role:"user", content: question});
        assistantMessages.push({role:"assistant", content:"Thinking…", pending:true});
        assistantBusy = true;
        render();

        try{
          const res = await fetch("/api/assistant/ask", {
            method: "POST",
            headers: {"Content-Type":"application/json", "Authorization":"Bearer " + token},
            body: JSON.stringify({courseId: assistantCourseId, conversationId: assistantConversationId, question}),
          });
          const json = await res.json();
          assistantMessages.pop(); // remove the pending placeholder
          if(!res.ok){
            assistantMessages.push({role:"assistant", content: json.error || "Something went wrong."});
          } else {
            if(json.history) assistantMessages = json.history; // server is authoritative — replaces local guess with what's actually saved
            if(json.conversationId){
              assistantConversationId = json.conversationId;
              assistantConversationsLoadedFor = null; // list is now stale (new/updated thread) — refresh next render
            }
          }
        }catch(err){
          assistantMessages.pop();
          assistantMessages.push({role:"assistant", content:"Could not reach the server — check your connection and try again."});
        }
        assistantBusy = false;
        render();
      });
    }
  }

  async function uploadFile(file){
    const fd = new FormData();
    fd.append("file", file);
    const res = await fetch("/api/files", { method:"POST", headers:{"Authorization":"Bearer " + authToken}, body: fd });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || "Could not upload the file.");
    return json; // {id, filename, mimeType, sizeBytes}
  }

  async function submitStudentAuth(fd){
    const matric = fd.get("matric");
    const password = fd.get("password");
    const isSignup = studentAuthMode === "signup";
    const url = isSignup ? "/api/auth/student-signup" : "/api/auth/student-login";
    const body = isSignup ? { matric, name: fd.get("name"), email: fd.get("email"), password } : { matric, password };
    try{
      const res = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
      const json = await res.json();
      if(!res.ok) return { ok:false, error: json.error || "Something went wrong." };
      setStudentSession(json.token, json.student);
      return { ok:true };
    }catch(err){
      return { ok:false, error:"Could not reach the server — check your connection." };
    }
  }

      '<form id="loginForm">' +
        '<div class="field"><label>Password</label><input required type="password" name="password" autofocus /></div>' +
        (loginError ? '<p class="hint" style="color:var(--rose); margin-bottom:10px;">' + escapeHtml(loginError) + '</p>' : '') +
        '<button class="btn" type="submit" style="width:100%;">Sign in</button>' +
      '</form>' +
      '</div></div>';
  }

  // ---------- CHECK-IN KIOSK ----------

  function getCheckinCode(){
    const m = location.hash.match(/^#checkin=([A-Za-z0-9]+)/);
    return m ? m[1].toUpperCase() : null;
  }

  function renderKiosk(code){
    const session = data.attendanceSessions.find(s => s.code === code);
    if(!session){
      return '<div class="kiosk-card"><span class="mark">Roll Call</span><h1>Link not recognized</h1><p class="sub">This check-in code doesn\'t match an active session. Ask the Governor for the current link.</p><a class="kiosk-back" href="#" id="kioskBack">Open full app</a></div>';
    }
    const lec = data.lectures.find(l => l.id === session.lectureId);
    const course = lec ? courseOf(lec.courseId) : null;
    const now = new Date();
    const starts = new Date(session.startsAt), ends = new Date(session.endsAt);

    if(now < starts){
      return '<div class="kiosk-card"><span class="mark">Roll Call</span><h1>' + escapeHtml(lec ? lec.title : "Session") + '</h1><p class="sub">' + escapeHtml(course ? course.name : "") + '</p><p class="sub">This check-in opens at ' + fmtDateTime(session.startsAt) + '.</p><a class="kiosk-back" href="#" id="kioskBack">Open full app</a></div>';
    }
    if(now > ends){
      return '<div class="kiosk-card"><span class="mark">Roll Call</span><h1>Check-in closed</h1><p class="sub">' + escapeHtml(lec ? lec.title : "Session") + '</p><p class="sub">This attendance window closed at ' + fmtDateTime(session.endsAt) + '.</p><a class="kiosk-back" href="#" id="kioskBack">Open full app</a></div>';
    }

    const remainMs = ends - now;
    const mm = Math.floor(remainMs/60000), ss = Math.floor((remainMs%60000)/1000);
    const countdown = "Closes in " + String(mm).padStart(2,"0") + ":" + String(ss).padStart(2,"0");

    // Not signed in — students need an account before they can check in,
    // so this is the same sign-in/sign-up form as the main app, just
    // rendered inline since kiosk mode replaces the whole page.
    if(!studentToken){
      const isSignup = studentAuthMode === "signup";
      return '<div class="kiosk-card"><span class="mark">Roll Call</span>' +
        '<h1>' + escapeHtml(lec ? lec.title : "Session") + '</h1>' +
        '<p class="sub">' + escapeHtml(course ? course.name : "") + '</p>' +
        '<div class="countdown">' + countdown + '</div>' +
        '<p class="sub" style="margin-bottom:10px;">' + (isSignup ? "Create an account to check in:" : "Sign in to check in:") + '</p>' +
        '<form id="kioskAuthForm">' +
          '<input required type="text" name="matric" placeholder="Matric number" autocapitalize="characters" style="margin-bottom:10px;" />' +
          (isSignup ? '<input required type="text" name="name" placeholder="Full name" style="margin-bottom:10px;" /><input required type="email" name="email" placeholder="Email address" style="margin-bottom:10px;" />' : '') +
          '<input required type="password" name="password" placeholder="Password" minlength="4" style="margin-bottom:10px;" />' +
          (studentAuthError ? '<p class="sub" style="color:var(--rose); margin-bottom:10px;">' + escapeHtml(studentAuthError) + '</p>' : '') +
          '<button class="btn" type="submit">' + (isSignup ? "Sign up & check in" : "Sign in & check in") + '</button>' +
        '</form>' +
        '<a class="kiosk-back" href="#" id="kioskAuthSwitch">' + (isSignup ? "Already registered? Sign in instead" : "New here? Create an account") + '</a>' +
        (!isSignup ? '<p class="sub" style="margin-top:6px;">Forgot your password? Ask your Governor to reset it.</p>' : '') +
        '<br><a class="kiosk-back" href="#" id="kioskBack">Open full app</a></div>';
    }

    const rec = getRecord(session.lectureId, studentInfo.id);
    if(rec.status === "present" && rec.method === "self"){
      return '<div class="kiosk-card"><span class="mark">Roll Call</span>' +
        '<div class="kiosk-success">You\'re marked present ✓</div>' +
        '<p class="sub">' + escapeHtml(studentInfo.name) + ' · signed at ' + fmtTime(rec.at) + '</p>' +
        '<p class="sub" style="margin-top:10px;">' + escapeHtml(lec ? lec.title : "") + '</p>' +
        '<a class="kiosk-back" href="#" id="kioskBack">Open full app</a></div>';
    }

    return '<div class="kiosk-card"><span class="mark">Roll Call</span>' +
      '<h1>' + escapeHtml(lec ? lec.title : "Session") + '</h1>' +
      '<p class="sub">' + escapeHtml(course ? course.name : "") + (lec && lec.topic ? " · " + escapeHtml(lec.topic) : "") + '</p>' +
      '<div class="countdown">' + countdown + '</div>' +
      '<p class="sub" style="margin-bottom:14px;">Signing in as <strong>' + escapeHtml(studentInfo.name) + '</strong> (' + escapeHtml(studentInfo.roll) + ')</p>' +
      '<form id="kioskForm">' +
        '<button class="btn" type="submit">Confirm attendance</button>' +
      '</form>' +
      '<a class="kiosk-back" href="#" id="kioskSwitchAccount">Not you? Sign out</a>' +
      '<br><a class="kiosk-back" href="#" id="kioskBack">Open full app</a></div>';
  }

  // ---------- MAIN RENDER ----------

  function render(){
    const code = getCheckinCode();
    document.body.classList.toggle("kiosk", !!code);

    if(code){
      const mainArea = document.getElementById("mainArea");
      if(mainArea) mainArea.innerHTML = "";
      let host = document.getElementById("kioskHost");
      if(!host){ host = document.createElement("div"); host.id = "kioskHost"; document.getElementById("appRoot").innerHTML = ""; document.getElementById("appRoot").appendChild(host); }
      host.innerHTML = renderKiosk(code);
      attachKioskEvents(code);
      if(!tickTimer) tickTimer = setInterval(render, 1000);
      return;
    } else if(tickTimer){ clearInterval(tickTimer); tickTimer = null; }

    // ensure normal app shell exists (in case we came back from kiosk mode)
    if(!document.getElementById("classNameInput")) location.reload();

    document.getElementById("classNameInput").value = data.className;
    document.getElementById("classNameInput").readOnly = (role !== "governor");
    document.getElementById("classSub").textContent = data.students.length + " students · " + data.courses.length + " courses · " + data.lectures.length + " lectures logged";

    const sideNav = document.getElementById("sideNav");
    let myTabBtn = sideNav.querySelector('[data-tab="mine"]');
    if(role === "student"){
      if(!myTabBtn){
        myTabBtn = document.createElement("div");
        myTabBtn.className = "navbtn";
        myTabBtn.dataset.tab = "mine";
        myTabBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg> My Attendance';
        sideNav.insertBefore(myTabBtn, sideNav.children[1]);
      }
    } else if(myTabBtn){ myTabBtn.remove(); if(activeTab === "mine") activeTab = "dashboard"; }

    document.getElementById("identityWrap").style.display = (role === "student" && studentInfo) ? "flex" : "none";
    if(role === "student" && studentInfo){
      document.getElementById("identityLabel").textContent = "Signed in as " + studentInfo.name + " (" + studentInfo.roll + ")";
    }

    const GOVERNOR_ONLY_TABS = ["attendance", "roster"];
    const STUDENT_ONLY_TABS = ["notifications", "cgpa"];
    if(role === "student" && GOVERNOR_ONLY_TABS.includes(activeTab)) activeTab = "mine";
    if(role === "governor" && STUDENT_ONLY_TABS.includes(activeTab)) activeTab = "dashboard";
    GOVERNOR_ONLY_TABS.forEach(tab => {
      const btn = sideNav.querySelector('[data-tab="' + tab + '"]');
      if(btn) btn.style.display = (role === "governor") ? "flex" : "none";
    });
    STUDENT_ONLY_TABS.forEach(tab => {
      const btn = sideNav.querySelector('[data-tab="' + tab + '"]');
      if(btn) btn.style.display = (role === "student") ? "flex" : "none";
    });
    document.querySelectorAll("#sideNav .navbtn").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab));
    document.querySelectorAll("#roleSeg button").forEach(b => b.classList.toggle("active", b.dataset.role === role));

    const notifBadge = document.getElementById("notifBadge");
    if(notifBadge){
      if(role === "student"){
        const unread = buildNotifications().filter(i => !getSeenNotifIds().has(i.id)).length;
        notifBadge.textContent = unread > 99 ? "99+" : String(unread);
        notifBadge.style.display = unread > 0 ? "inline-block" : "none";
      } else {
        notifBadge.style.display = "none";
      }
    }

    const main = document.getElementById("mainArea");
    if(activeTab === "dashboard") main.innerHTML = renderDashboard();
    else if(activeTab === "notifications") main.innerHTML = renderNotifications();
    else if(activeTab === "cgpa") { main.innerHTML = renderCgpa(); attachCgpaEvents(); }
    else if(activeTab === "attendance") main.innerHTML = renderAttendance();
    else if(activeTab === "materials") main.innerHTML = renderMaterials();
    else if(activeTab === "assignments") main.innerHTML = renderAssignments();
    else if(activeTab === "announcements") main.innerHTML = renderAnnouncements();
    else if(activeTab === "courses") main.innerHTML = renderCourses();
    else if(activeTab === "roster") main.innerHTML = renderRoster();
    else if(activeTab === "mine") main.innerHTML = renderMyAttendance();
    else if(activeTab === "assistant") { main.innerHTML = renderAssistant(); attachAssistantEvents(); }

    if(notificationHighlight && notificationHighlight.tab === activeTab){
      const target = notificationHighlight.targetId;
      const el = main.querySelector('[data-material-id="' + target + '"], [data-assignment-id="' + target + '"], [data-announcement-id="' + target + '"]');
      if(el){
        el.classList.add("highlight-flash");
        setTimeout(() => el.scrollIntoView({behavior:"smooth", block:"center"}), 30);
      }
      notificationHighlight = null;
    }

    let drawerHost = document.getElementById("drawerHost");
    if(!drawerHost){ drawerHost = document.createElement("div"); drawerHost.id = "drawerHost"; document.body.appendChild(drawerHost); }
    drawerHost.innerHTML = renderStudentDrawer() + renderCourseDrawer() + renderLoginModal() + renderStudentAuthModal();

    const signOutBtn = document.getElementById("signOutBtn");
    if(role === "governor" && authToken){ signOutBtn.style.display = "inline"; signOutBtn.textContent = "Sign out"; }
    else if(role === "student" && studentToken){ signOutBtn.style.display = "inline"; signOutBtn.textContent = "Sign out"; }
    else signOutBtn.style.display = "none";

    attachEvents();
  }

  function attachKioskEvents(code){
    const back = document.getElementById("kioskBack");
    if(back) back.addEventListener("click", (e) => { e.preventDefault(); location.hash = ""; render(); });

    const switchAccount = document.getElementById("kioskSwitchAccount");
    if(switchAccount) switchAccount.addEventListener("click", (e) => { e.preventDefault(); studentLogout(); });

    const authSwitch = document.getElementById("kioskAuthSwitch");
    if(authSwitch) authSwitch.addEventListener("click", (e) => { e.preventDefault(); studentAuthMode = studentAuthMode === "signup" ? "signin" : "signup"; studentAuthError = ""; render(); });

    const authForm = document.getElementById("kioskAuthForm");
    if(authForm){
      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(authForm);
        const submitBtn = authForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true; submitBtn.textContent = "Please wait…";
        const result = await submitStudentAuth(fd);
        if(result.ok){ studentAuthError = ""; myIdentityId = studentInfo.id; render(); }
        else { studentAuthError = result.error; render(); }
      });
    }

    const form = document.getElementById("kioskForm");
    if(form){
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true; submitBtn.textContent = "Signing in…";
        try{
          const res = await fetch("/api/checkin/" + encodeURIComponent(code) + "/signin", {
            method: "POST",
            headers: {"Content-Type":"application/json", "Authorization":"Bearer " + studentToken},
            body: JSON.stringify({}),
          });
          const json = await res.json();
          if(res.status === 401){ studentLogout(); return; }
          if(!res.ok){ alert(json.error || "Could not sign in."); submitBtn.disabled = false; submitBtn.textContent = "Confirm attendance"; return; }
          if(!data.attendance[json.lectureId]) data.attendance[json.lectureId] = {};
          data.attendance[json.lectureId][json.studentId] = json.record;
          if(typeof json.version === "number") stateVersion = json.version;
        }catch(err){
          alert("Could not reach the server — check your connection and try again.");
          submitBtn.disabled = false; submitBtn.textContent = "Confirm attendance";
          return;
        }
        render();
      });
    }
  }

  function attachEvents(){
    document.querySelectorAll("[data-notif]").forEach(el => el.addEventListener("click", () => {
      const id = el.getAttribute("data-notif");
      const tab = el.getAttribute("data-notif-tab");
      const targetId = el.getAttribute("data-notif-target");
      markNotifSeen(id);
      // Clear any active filter that could otherwise hide the item we're jumping to.
      materialsCourseFilter = ""; materialsTypeFilter = ""; materialsSearch = ""; assignmentsCourseFilter = "";
      notificationHighlight = {tab, targetId};
      activeTab = tab;
      render();
    }));
    const markAllNotifsRead = document.getElementById("markAllNotifsRead");
    if(markAllNotifsRead) markAllNotifsRead.addEventListener("click", () => { markAllNotifsSeen(buildNotifications()); render(); });
    const dashboardNotifBanner = document.getElementById("dashboardNotifBanner");
    if(dashboardNotifBanner) dashboardNotifBanner.addEventListener("click", () => { activeTab = "notifications"; render(); });

    const lectureCourseSelect = document.getElementById("lectureCourseSelect");
    const lectureLecturerSelect = document.getElementById("lectureLecturerSelect");
    function refreshLecturerOptions(){
      if(!lectureCourseSelect || !lectureLecturerSelect) return;
      const course = courseOf(lectureCourseSelect.value);
      const editingLecture = editingLectureId ? data.lectures.find(l => l.id === editingLectureId) : null;
      lectureLecturerSelect.innerHTML = '<option value="">Unassigned</option>' + (course ? (course.lecturers||[]).map(l => '<option value="' + l.id + '" ' + (editingLecture && editingLecture.lecturerId===l.id?'selected':'') + '>' + escapeHtml(l.name) + '</option>').join("") : "");
    }
    if(lectureCourseSelect){ lectureCourseSelect.addEventListener("change", refreshLecturerOptions); refreshLecturerOptions(); }

    const lectureForm = document.getElementById("lectureForm");
    if(lectureForm){
      lectureForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(lectureForm);
        const id = fd.get("id");
        const payload = {courseId: fd.get("courseId"), lecturerId: fd.get("lecturerId") || null, title: fd.get("title").trim(), date: fd.get("date"), topic: fd.get("topic").trim()};
        if(id){ Object.assign(data.lectures.find(x => x.id === id), payload); editingLectureId = null; }
        else { const l = Object.assign({id: uid()}, payload); data.lectures.push(l); data.attendance[l.id] = {}; selectedLectureId = l.id; }
        await saveData(); render();
      });
    }
    const cancelLectureEdit = document.getElementById("cancelLectureEdit");
    if(cancelLectureEdit) cancelLectureEdit.addEventListener("click", () => { editingLectureId = null; render(); });

    const attendanceCourseFilterEl = document.getElementById("attendanceCourseFilter");
    if(attendanceCourseFilterEl) attendanceCourseFilterEl.addEventListener("change", () => { attendanceCourseFilter = attendanceCourseFilterEl.value; selectedLectureId = null; render(); });
    const lectureSelect = document.getElementById("lectureSelect");
    if(lectureSelect) lectureSelect.addEventListener("change", () => { selectedLectureId = lectureSelect.value; render(); });

    document.querySelectorAll("[data-toggle-student]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const sid = btn.getAttribute("data-toggle-student");
        const cur = getRecord(selectedLectureId, sid).status;
        const next = cur === "unmarked" ? "present" : cur === "present" ? "absent" : "unmarked";
        setRecord(selectedLectureId, sid, next, "manual");
        await saveData(); render();
      });
    });

    const markAllPresent = document.getElementById("markAllPresent");
    if(markAllPresent) markAllPresent.addEventListener("click", async () => { data.students.forEach(s => setRecord(selectedLectureId, s.id, "present", "manual")); await saveData(); render(); });
    const clearMarks = document.getElementById("clearMarks");
    if(clearMarks) clearMarks.addEventListener("click", async () => { data.attendance[selectedLectureId] = {}; await saveData(); render(); });
    const editThisLecture = document.getElementById("editThisLecture");
    if(editThisLecture) editThisLecture.addEventListener("click", () => { editingLectureId = selectedLectureId; render(); window.scrollTo({top:0, behavior:"smooth"}); });
    const deleteThisLecture = document.getElementById("deleteThisLecture");
    if(deleteThisLecture) deleteThisLecture.addEventListener("click", async () => {
      if(!(await confirmDialog("This deletes the lecture and its attendance record. This cannot be undone.", {title:"Delete this lecture?", confirmLabel:"Delete lecture"}))) return;
      data.lectures = data.lectures.filter(l => l.id !== selectedLectureId);
      delete data.attendance[selectedLectureId];
      data.attendanceSessions = data.attendanceSessions.filter(s => s.lectureId !== selectedLectureId);
      selectedLectureId = null; await saveData(); render();
    });
    const exportLectureCsvBtn = document.getElementById("exportLectureCsv");
    if(exportLectureCsvBtn) exportLectureCsvBtn.addEventListener("click", () => {
      const lec = data.lectures.find(l => l.id === selectedLectureId);
      const rows = [["Matric No.","Name","Status","Method","Signed at"]].concat(data.students.map(s => { const r = getRecord(selectedLectureId, s.id); return [s.roll, s.name, r.status, r.method||"", r.at?fmtDateTime(r.at):""]; }));
      downloadCsv("attendance_" + (lec.title||"session").replace(/\s+/g,"_") + ".csv", rows);
    });
    const exportLecturePdfBtn = document.getElementById("exportLecturePdf");
    if(exportLecturePdfBtn) exportLecturePdfBtn.addEventListener("click", () => exportLecturePdf(selectedLectureId));

    const sessionForm = document.getElementById("sessionForm");
    if(sessionForm){
      sessionForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(sessionForm);
        const startsAt = new Date(fd.get("startsAt")).toISOString();
        const duration = parseInt(fd.get("duration"), 10) || 15;
        const endsAt = new Date(new Date(startsAt).getTime() + duration*60000).toISOString();
        data.attendanceSessions.push({id: uid(), lectureId: selectedLectureId, code: genCode(), startsAt, endsAt, createdAt: new Date().toISOString()});
        await saveData(); render();
      });
    }
    document.querySelectorAll("[data-copy-link]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const ok = await copyText(checkinUrl(btn.getAttribute("data-copy-link")));
        btn.textContent = ok ? "Copied!" : "Copy failed";
        setTimeout(() => { btn.textContent = "Copy link"; }, 1500);
      });
    });
    document.querySelectorAll("[data-preview-checkin]").forEach(btn => {
      btn.addEventListener("click", () => { location.hash = "checkin=" + btn.getAttribute("data-preview-checkin"); render(); });
    });

    // Materials
    const materialForm = document.getElementById("materialForm");
    if(materialForm){
      const courseSel = document.getElementById("materialCourseSelect");
      const lecSel = document.getElementById("materialLectureSelect");
      if(courseSel && lecSel){
        courseSel.addEventListener("change", () => {
          const cid = courseSel.value;
          lecSel.innerHTML = '<option value="">General / not tied to a lecture</option>' + data.lectures.filter(l => !cid || l.courseId === cid).map(l => '<option value="' + l.id + '">' + escapeHtml(l.title) + " — " + fmtDate(l.date) + '</option>').join("");
        });
      }
      materialForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(materialForm);
        const id = fd.get("id");
        const tags = fd.get("tags").split(",").map(t => t.trim()).filter(Boolean);
        const submitBtn = materialForm.querySelector('button[type="submit"]');
        const existing = id ? data.materials.find(m => m.id === id) : null;
        const basePayload = {title: fd.get("title").trim(), type: fd.get("type"), courseId: fd.get("courseId") || null, lectureId: fd.get("lectureId") || null, link: fd.get("link").trim(), notes: fd.get("notes").trim(), tags};
        const chosenFiles = Array.from(document.getElementById("materialFileInput").files || []);

        // Editing an existing entry always replaces with at most one file.
        const filesToProcess = id ? chosenFiles.slice(0, 1) : chosenFiles;

        if(filesToProcess.length > 1){
          submitBtn.disabled = true;
          let uploadedCount = 0;
          for(const file of filesToProcess){
            submitBtn.textContent = "Uploading " + (uploadedCount+1) + " of " + filesToProcess.length + "…";
            try{
              const uploaded = await uploadFile(file);
              data.materials.push(Object.assign({id: uid(), date: new Date().toISOString().slice(0,10)}, basePayload, {
                title: basePayload.title + " — " + uploaded.filename,
                fileId: uploaded.id, fileName: uploaded.filename,
              }));
              uploadedCount++;
            }catch(err){
              alert("Uploaded " + uploadedCount + " of " + filesToProcess.length + " before this failed: " + (err.message || "unknown error"));
              submitBtn.disabled = false; submitBtn.textContent = "Add material";
              if(uploadedCount > 0){ await saveData(); render(); }
              return;
            }
          }
          await saveData(); render();
          return;
        }

        const payload = Object.assign({}, basePayload);
        if(filesToProcess.length === 1){
          submitBtn.disabled = true; submitBtn.textContent = "Uploading…";
          try{
            const uploaded = await uploadFile(filesToProcess[0]);
            payload.fileId = uploaded.id; payload.fileName = uploaded.filename;
          }catch(err){
            alert(err.message || "Could not upload the file.");
            submitBtn.disabled = false; submitBtn.textContent = id ? "Save changes" : "Add material";
            return;
          }
        } else if(existing){
          payload.fileId = existing.fileId; payload.fileName = existing.fileName;
        }
        if(id){ Object.assign(existing, payload); editingMaterialId = null; }
        else { data.materials.push(Object.assign({id: uid(), date: new Date().toISOString().slice(0,10)}, payload)); }
        await saveData(); render();
      });
    }
    const cancelMaterialEdit = document.getElementById("cancelMaterialEdit");
    if(cancelMaterialEdit) cancelMaterialEdit.addEventListener("click", () => { editingMaterialId = null; render(); });
    document.querySelectorAll("[data-edit-material]").forEach(btn => btn.addEventListener("click", () => { editingMaterialId = btn.getAttribute("data-edit-material"); render(); window.scrollTo({top:0, behavior:"smooth"}); }));
    document.querySelectorAll("[data-delete-material]").forEach(btn => btn.addEventListener("click", async () => { data.materials = data.materials.filter(m => m.id !== btn.getAttribute("data-delete-material")); await saveData(); render(); }));
    const materialsSearchEl = document.getElementById("materialsSearch");
    if(materialsSearchEl){ materialsSearchEl.addEventListener("input", () => { materialsSearch = materialsSearchEl.value; render(); const el = document.getElementById("materialsSearch"); if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } }); }
    const materialsCourseFilterEl = document.getElementById("materialsCourseFilter");
    if(materialsCourseFilterEl) materialsCourseFilterEl.addEventListener("change", () => { materialsCourseFilter = materialsCourseFilterEl.value; render(); });
    const materialsTypeFilterEl = document.getElementById("materialsTypeFilter");
    if(materialsTypeFilterEl) materialsTypeFilterEl.addEventListener("change", () => { materialsTypeFilter = materialsTypeFilterEl.value; render(); });

    // Assignments
    const assignmentForm = document.getElementById("assignmentForm");
    if(assignmentForm){
      assignmentForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(assignmentForm);
        const id = fd.get("id");
        const existing = id ? data.assignments.find(a => a.id === id) : null;
        const submitBtn = assignmentForm.querySelector('button[type="submit"]');
        const payload = {courseId: fd.get("courseId"), title: fd.get("title").trim(), description: fd.get("description").trim(), dueDate: fd.get("dueDate"), link: fd.get("link").trim()};
        const chosenFile = document.getElementById("assignmentFileInput").files[0];
        if(chosenFile){
          submitBtn.disabled = true; submitBtn.textContent = "Uploading…";
          try{
            const uploaded = await uploadFile(chosenFile);
            payload.fileId = uploaded.id; payload.fileName = uploaded.filename;
          }catch(err){
            alert(err.message || "Could not upload the file.");
            submitBtn.disabled = false; submitBtn.textContent = id ? "Save changes" : "Post assignment";
            return;
          }
        } else if(existing){
          payload.fileId = existing.fileId; payload.fileName = existing.fileName;
        }
        if(id){ Object.assign(existing, payload); editingAssignmentId = null; }
        else { data.assignments.push(Object.assign({id: uid(), createdAt: new Date().toISOString().slice(0,10)}, payload)); }
        await saveData(); render();
      });
    }
    const cancelAssignmentEdit = document.getElementById("cancelAssignmentEdit");
    if(cancelAssignmentEdit) cancelAssignmentEdit.addEventListener("click", () => { editingAssignmentId = null; render(); });
    document.querySelectorAll("[data-edit-assignment]").forEach(btn => btn.addEventListener("click", () => { editingAssignmentId = btn.getAttribute("data-edit-assignment"); render(); window.scrollTo({top:0, behavior:"smooth"}); }));
    document.querySelectorAll("[data-delete-assignment]").forEach(btn => btn.addEventListener("click", async () => { data.assignments = data.assignments.filter(a => a.id !== btn.getAttribute("data-delete-assignment")); await saveData(); render(); }));
    const assignmentsCourseFilterEl = document.getElementById("assignmentsCourseFilter");
    if(assignmentsCourseFilterEl) assignmentsCourseFilterEl.addEventListener("change", () => { assignmentsCourseFilter = assignmentsCourseFilterEl.value; render(); });

    // Announcements
    const announceForm = document.getElementById("announceForm");
    if(announceForm){
      announceForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(announceForm);
        const submitBtn = announceForm.querySelector('button[type="submit"]');
        const payload = {id: uid(), title: fd.get("title").trim(), body: fd.get("body").trim(), pinned: !!fd.get("pinned"), date: new Date().toISOString().slice(0,10)};
        const chosenFile = document.getElementById("announceFileInput").files[0];
        if(chosenFile){
          submitBtn.disabled = true; submitBtn.textContent = "Uploading…";
          try{
            const uploaded = await uploadFile(chosenFile);
            payload.fileId = uploaded.id; payload.fileName = uploaded.filename;
          }catch(err){
            alert(err.message || "Could not upload the file.");
            submitBtn.disabled = false; submitBtn.textContent = "Post";
            return;
          }
        }
        data.announcements.push(payload);
        await saveData(); render();
      });
    }
    document.querySelectorAll("[data-toggle-pin]").forEach(btn => btn.addEventListener("click", async () => { const a = data.announcements.find(x => x.id === btn.getAttribute("data-toggle-pin")); a.pinned = !a.pinned; await saveData(); render(); }));
    document.querySelectorAll("[data-delete-announce]").forEach(btn => btn.addEventListener("click", async () => { data.announcements = data.announcements.filter(a => a.id !== btn.getAttribute("data-delete-announce")); await saveData(); render(); }));

    // Courses
    const courseForm = document.getElementById("courseForm");
    if(courseForm){
      courseForm.querySelectorAll(".colorRadio").forEach(r => {
        const dot = r.nextElementSibling;
        if(r.checked) dot.style.outline = "2px solid var(--chalk)";
        r.addEventListener("change", () => { courseForm.querySelectorAll(".course-dot").forEach(d => d.style.outline = "2px solid transparent"); if(r.checked) dot.style.outline = "2px solid var(--chalk)"; });
      });
      courseForm.querySelectorAll(".course-dot").forEach(dot => dot.addEventListener("click", () => { const radio = dot.previousElementSibling; radio.checked = true; radio.dispatchEvent(new Event("change")); }));

      const addPendingLecturerBtn = document.getElementById("addPendingLecturerBtn");
      if(addPendingLecturerBtn){
        addPendingLecturerBtn.addEventListener("click", () => {
          const nameInput = document.getElementById("courseLecturerName");
          const emailInput = document.getElementById("courseLecturerEmail");
          const name = nameInput.value.trim();
          if(!name) { nameInput.focus(); return; }
          pendingLecturers.push({id: uid(), name, email: emailInput.value.trim()});
          render();
        });
      }
      document.querySelectorAll("[data-remove-pending-lecturer]").forEach(btn => {
        btn.addEventListener("click", () => {
          pendingLecturers.splice(parseInt(btn.getAttribute("data-remove-pending-lecturer"), 10), 1);
          render();
        });
      });


      courseForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(courseForm);
        const id = fd.get("id");
        const existing = id ? data.courses.find(c => c.id === id) : null;
        const submitBtn = courseForm.querySelector('button[type="submit"]');
        const payload = {
          code: fd.get("code").trim(),
          name: fd.get("name").trim(),
          color: fd.get("color") || COURSE_COLORS[0],
          units: fd.get("units") ? parseInt(fd.get("units"), 10) : null,
          lecturers: pendingLecturers.map(l => ({id: l.id, name: l.name, email: l.email})),
          outlineText: fd.get("outlineText").trim(),
          outlineLink: fd.get("outlineLink").trim(),
        };
        const chosenOutlineFile = document.getElementById("courseOutlineFileInput").files[0];
        if(chosenOutlineFile){
          submitBtn.disabled = true; submitBtn.textContent = "Uploading…";
          try{
            const uploaded = await uploadFile(chosenOutlineFile);
            payload.outlineFileId = uploaded.id; payload.outlineFileName = uploaded.filename;
          }catch(err){
            alert(err.message || "Could not upload the file.");
            submitBtn.disabled = false; submitBtn.textContent = id ? "Save changes" : "Add course";
            return;
          }
        } else if(existing){
          payload.outlineFileId = existing.outlineFileId; payload.outlineFileName = existing.outlineFileName;
        }
        if(id){ Object.assign(existing, payload); editingCourseId = null; }
        else { data.courses.push(Object.assign({id: uid()}, payload)); }
        pendingLecturers = []; pendingLecturersFor = "__new__";
        await saveData(); render();
      });
    }
    const cancelCourseEdit = document.getElementById("cancelCourseEdit");
    if(cancelCourseEdit) cancelCourseEdit.addEventListener("click", () => { editingCourseId = null; pendingLecturers = []; pendingLecturersFor = "__new__"; render(); });
    document.querySelectorAll("[data-edit-course]").forEach(btn => btn.addEventListener("click", () => { editingCourseId = btn.getAttribute("data-edit-course"); pendingLecturersFor = null; render(); window.scrollTo({top:0, behavior:"smooth"}); }));
    document.querySelectorAll("[data-delete-course]").forEach(btn => btn.addEventListener("click", async () => {
      const cid = btn.getAttribute("data-delete-course");
      if(!(await confirmDialog("Its lectures and materials will remain but become unassigned from any course.", {title:"Delete this course?", confirmLabel:"Delete course"}))) return;
      data.courses = data.courses.filter(c => c.id !== cid);
      data.lectures.forEach(l => { if(l.courseId === cid) l.courseId = null; });
      data.materials.forEach(m => { if(m.courseId === cid) m.courseId = null; });
      data.assignments = data.assignments.filter(a => a.courseId !== cid);
      await saveData(); render();
    }));
    document.querySelectorAll("[data-open-course]").forEach(btn => btn.addEventListener("click", () => { drawerCourseId = btn.getAttribute("data-open-course"); render(); }));
    document.querySelectorAll("[data-archive-course]").forEach(btn => btn.addEventListener("click", async () => {
      const c = courseOf(btn.getAttribute("data-archive-course"));
      if(c){ c.archived = true; await saveData(); render(); }
    }));
    document.querySelectorAll("[data-unarchive-course]").forEach(btn => btn.addEventListener("click", async () => {
      const c = courseOf(btn.getAttribute("data-unarchive-course"));
      if(c){ c.archived = false; await saveData(); render(); }
    }));
    document.querySelectorAll("[data-student-archive-course]").forEach(btn => btn.addEventListener("click", () => {
      const set = getStudentArchivedCourses(); set.add(btn.getAttribute("data-student-archive-course")); setStudentArchivedCourses(set); render();
    }));
    document.querySelectorAll("[data-student-unarchive-course]").forEach(btn => btn.addEventListener("click", () => {
      const set = getStudentArchivedCourses(); set.delete(btn.getAttribute("data-student-unarchive-course")); setStudentArchivedCourses(set); render();
    }));
    const toggleArchivedCourses = document.getElementById("toggleArchivedCourses");
    if(toggleArchivedCourses) toggleArchivedCourses.addEventListener("click", () => { showArchivedCourses = !showArchivedCourses; render(); });

    // Course drawer
    const closeCourseDrawer = document.getElementById("closeCourseDrawer");
    if(closeCourseDrawer) closeCourseDrawer.addEventListener("click", () => { drawerCourseId = null; render(); });
    const courseDrawerOverlay = document.getElementById("courseDrawerOverlay");
    if(courseDrawerOverlay) courseDrawerOverlay.addEventListener("click", (e) => { if(e.target === courseDrawerOverlay){ drawerCourseId = null; render(); } });

    const lecturerForm = document.getElementById("lecturerForm");
    if(lecturerForm){
      lecturerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(lecturerForm);
        const course = courseOf(drawerCourseId);
        if(!course) return;
        if(!course.lecturers) course.lecturers = [];
        course.lecturers.push({id: uid(), name: fd.get("name").trim(), email: fd.get("email").trim()});
        await saveData(); render();
      });
    }
    document.querySelectorAll("[data-remove-lecturer]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const course = courseOf(drawerCourseId);
        if(!course) return;
        course.lecturers = (course.lecturers||[]).filter(l => l.id !== btn.getAttribute("data-remove-lecturer"));
        await saveData(); render();
      });
    });

    const outlineForm = document.getElementById("outlineForm");
    if(outlineForm){
      outlineForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(outlineForm);
        const course = courseOf(drawerCourseId);
        if(!course) return;
        const submitBtn = outlineForm.querySelector('button[type="submit"]');
        const chosenFile = document.getElementById("outlineFileInput").files[0];
        if(chosenFile){
          submitBtn.disabled = true; submitBtn.textContent = "Uploading…";
          try{
            const uploaded = await uploadFile(chosenFile);
            course.outlineFileId = uploaded.id; course.outlineFileName = uploaded.filename;
          }catch(err){
            alert(err.message || "Could not upload the file.");
            submitBtn.disabled = false; submitBtn.textContent = "Save outline";
            return;
          }
        }
        course.outlineText = fd.get("outlineText").trim();
        course.outlineLink = fd.get("outlineLink").trim();
        await saveData(); render();
      });
    }

    // Roster
    const studentForm = document.getElementById("studentForm");
    if(studentForm){
      studentForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(studentForm);
        const roll = fd.get("roll").trim();
        const dup = data.students.find(s => (s.roll||"").trim().toUpperCase() === roll.toUpperCase());
        if(dup){ alert("A student with matric number " + roll + " is already on the roll (" + dup.name + ")."); return; }
        data.students.push({id: uid(), roll, name: fd.get("name").trim(), email: fd.get("email").trim()});
        await saveData(); render();
      });
    }
    const importForm = document.getElementById("importForm");
    if(importForm){
      const csvFileInput = document.getElementById("csvFileInput");
      if(csvFileInput){
        csvFileInput.addEventListener("change", () => {
          const file = csvFileInput.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = () => { importForm.querySelector('[name="csvText"]').value = reader.result; };
          reader.readAsText(file);
        });
      }
      importForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(importForm);
        const text = fd.get("csvText").trim();
        if(!text){ importSummary = "Nothing to import."; render(); return; }
        const rows = parseCsvText(text);
        let added = 0, updated = 0;
        rows.forEach(cols => {
          if(!cols.length) return;
          if(cols[0] && cols[0].toLowerCase() === "roll") return; // skip header
          const roll = (cols[0]||"").trim();
          const name = (cols[1]||"").trim();
          const email = (cols[2]||"").trim();
          if(!roll || !name) return;
          const existing = data.students.find(s => s.roll === roll);
          if(existing){ existing.name = name; existing.email = email || existing.email; updated++; }
          else { data.students.push({id: uid(), roll, name, email}); added++; }
        });
        importSummary = added + " added, " + updated + " updated.";
        await saveData(); render();
      });
    }
    document.querySelectorAll("[data-delete-student]").forEach(btn => btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const studentId = btn.getAttribute("data-delete-student");
      const student = data.students.find(s => s.id === studentId);
      if(!(await confirmDialog("If they signed up with a matric number and password, that will be cleared too, so they could sign up again if re-added.", {title:"Remove " + (student ? student.name : "this student") + " from the roll?", confirmLabel:"Remove student"}))) return;
      try{
        const res = await fetch("/api/students/" + encodeURIComponent(studentId), {
          method: "DELETE",
          headers: {"Authorization":"Bearer " + authToken},
        });
        const json = await res.json();
        if(!res.ok){ alert(json.error || "Could not remove the student."); return; }
        await loadData(); render();
      }catch(err){
        alert("Could not reach the server — check your connection and try again.");
      }
    }));
    document.querySelectorAll("[data-reset-password]").forEach(btn => btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const studentId = btn.getAttribute("data-reset-password");
      const student = data.students.find(s => s.id === studentId);
      const newPassword = prompt("New password for " + (student ? student.name : "this student") + " (at least 4 characters):");
      if(newPassword === null) return;
      if(newPassword.length < 4){ alert("Password must be at least 4 characters."); return; }
      try{
        const res = await fetch("/api/students/" + encodeURIComponent(studentId) + "/reset-password", {
          method: "POST",
          headers: {"Content-Type":"application/json", "Authorization":"Bearer " + authToken},
          body: JSON.stringify({newPassword}),
        });
        const json = await res.json();
        if(!res.ok){ alert(json.error || "Could not reset the password."); return; }
        alert("Password reset. Share the new password with " + (student ? student.name : "the student") + " — they can sign in with it right away.");
      }catch(err){
        alert("Could not reach the server — check your connection and try again.");
      }
    }));
    const exportRosterCsvBtn = document.getElementById("exportRosterCsv");
    if(exportRosterCsvBtn) exportRosterCsvBtn.addEventListener("click", () => {
      const rows = [["Matric No.","Name","Email","Sessions Present","Total Sessions","Attendance %"]].concat(data.students.map(s => { const st = studentStats(s.id); return [s.roll, s.name, s.email||"", st.present, st.total, st.pct===null?"":st.pct]; }));
      downloadCsv("roster_attendance_summary.csv", rows);
    });
    const exportRosterPdfBtn = document.getElementById("exportRosterPdf");
    if(exportRosterPdfBtn) exportRosterPdfBtn.addEventListener("click", exportRosterPdf);

    document.querySelectorAll("[data-open-student]").forEach(tr => tr.addEventListener("click", () => { drawerStudentId = tr.getAttribute("data-open-student"); render(); }));
    const closeStudentDrawer = document.getElementById("closeStudentDrawer");
    if(closeStudentDrawer) closeStudentDrawer.addEventListener("click", () => { drawerStudentId = null; render(); });
    const studentDrawerOverlay = document.getElementById("studentDrawerOverlay");
    if(studentDrawerOverlay) studentDrawerOverlay.addEventListener("click", (e) => { if(e.target === studentDrawerOverlay){ drawerStudentId = null; render(); } });

    // Governor login
    const closeLoginDrawer = document.getElementById("closeLoginDrawer");
    if(closeLoginDrawer) closeLoginDrawer.addEventListener("click", () => { loginOpen = false; render(); });
    const loginDrawerOverlay = document.getElementById("loginDrawerOverlay");
    if(loginDrawerOverlay) loginDrawerOverlay.addEventListener("click", (e) => { if(e.target === loginDrawerOverlay){ loginOpen = false; render(); } });
    const loginForm = document.getElementById("loginForm");
    if(loginForm){
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(loginForm);
        const submitBtn = loginForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true; submitBtn.textContent = "Signing in…";
        const result = await governorLogin(fd.get("password"));
        if(result.ok){
          loginOpen = false; loginError = ""; role = "governor"; myIdentityId = null;
          await loadData(); render();
        } else {
          loginError = result.error; render();
        }
      });
    }

    // Student auth (sign in / sign up)
    const closeStudentAuthDrawer = document.getElementById("closeStudentAuthDrawer");
    if(closeStudentAuthDrawer) closeStudentAuthDrawer.addEventListener("click", () => { studentAuthOpen = false; render(); });
    const studentAuthOverlay = document.getElementById("studentAuthOverlay");
    if(studentAuthOverlay) studentAuthOverlay.addEventListener("click", (e) => { if(e.target === studentAuthOverlay){ studentAuthOpen = false; render(); } });
    const studentAuthSwitch = document.getElementById("studentAuthSwitch");
    if(studentAuthSwitch) studentAuthSwitch.addEventListener("click", (e) => { e.preventDefault(); studentAuthMode = studentAuthMode === "signup" ? "signin" : "signup"; studentAuthError = ""; render(); });
    const studentAuthForm = document.getElementById("studentAuthForm");
    if(studentAuthForm){
      studentAuthForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(studentAuthForm);
        const submitBtn = studentAuthForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true; submitBtn.textContent = "Please wait…";
        const result = await submitStudentAuth(fd);
        if(result.ok){
          studentAuthOpen = false; studentAuthError = ""; role = "student"; myIdentityId = studentInfo.id;
          await loadData(); render();
        } else {
          studentAuthError = result.error; render();
        }
      });
    }
  }

  document.getElementById("sideNav").addEventListener("click", (e) => { const btn = e.target.closest(".navbtn"); if(!btn) return; activeTab = btn.dataset.tab; render(); });
  document.getElementById("roleSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if(!btn) return;
    if(btn.dataset.role === "governor"){
      if(!authToken){ loginOpen = true; loginError = ""; render(); return; }
      role = "governor"; myIdentityId = null; if(activeTab === "mine") activeTab = "dashboard";
      render();
      return;
    }
    // student
    if(!studentToken){ studentAuthOpen = true; studentAuthMode = "signin"; studentAuthError = ""; render(); return; }
    role = "student"; myIdentityId = studentInfo ? studentInfo.id : null;
    render();
  });
  document.getElementById("signOutBtn").addEventListener("click", () => {
    if(role === "governor") governorLogout();
    else studentLogout();
  });

  const classNameInput = document.getElementById("classNameInput");
  let nameSaveTimer;
  classNameInput.addEventListener("input", () => { data.className = classNameInput.value; clearTimeout(nameSaveTimer); nameSaveTimer = setTimeout(saveData, 500); });

  window.addEventListener("hashchange", render);

  (async function init(){
    await loadData();
    render();
  })();
})();
</script>
</body>
</html>
